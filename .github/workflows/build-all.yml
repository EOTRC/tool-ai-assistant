name: build-all

on:
  workflow_dispatch:
  push:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libdbus-1-dev libwayland-dev \
            libxkbcommon-dev

      - name: Build
        working-directory: rs
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tool-${{ matrix.target }}
          path: |
            rs/target/${{ matrix.target }}/release/tool${{ matrix.os == 'windows-latest' && '.exe' || '' }}
            rs/target/${{ matrix.target }}/release/toolcmd${{ matrix.os == 'windows-latest' && '.exe' || '' }}
            rs/settings.cfg.template
