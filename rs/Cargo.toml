[package]
name = "tool"
version = "0.2.0"
edition = "2021"

[dependencies]
serde_json = "1"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
pdf-extract = "0.8"
arboard = "3"
screenshots = "0.8"

[[bin]]
name = "tool"
path = "src/main.rs"

[[bin]]
name = "toolcmd"
path = "src/bin/toolcmd.rs"

[profile.release]
opt-level = 3
strip = true
